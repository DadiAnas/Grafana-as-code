<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b1f33" flood-opacity="0.18"/>
    </filter>
    <marker id="scrape" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L13,7 L0,14 z" fill="#0a9396"/>
    </marker>
    <marker id="rw" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L13,7 L0,14 z" fill="#3f3f9e"/>
    </marker>
    <marker id="query" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L13,7 L0,14 z" fill="#f46800"/>
    </marker>
    <marker id="alert" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L13,7 L0,14 z" fill="#d62828"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#e4ebf2" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1480" height="980" fill="#f6f9fc"/>
  <rect width="1480" height="980" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#0b1f33">Crunchy PostgreSQL — Monitoring &amp; Alerting Pipeline</text>

  <!-- ===================== OPENSHIFT CLUSTER ===================== -->
  <rect x="40" y="110" width="660" height="830" rx="16" fill="#ffffff" stroke="#ee0000" stroke-width="2.5"/>
  <rect x="40" y="110" width="660" height="44" rx="16" fill="#ee0000"/>
  <rect x="40" y="138" width="660" height="16" fill="#ee0000"/>
  <circle cx="68" cy="132" r="11" fill="#ffffff"/>
  <text x="88" y="139" font-size="19" font-weight="700" fill="#ffffff">Red Hat OpenShift Cluster</text>
  <text x="520" y="139" font-size="13" fill="#ffd6d6">ns: postgres-prod</text>

  <!-- PostgresCluster box -->
  <rect x="70" y="185" width="360" height="545" rx="12" fill="#eef4fb" stroke="#336791" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="213" font-size="16" font-weight="700" fill="#336791">PostgresCluster (PGO)</text>

  <!-- PRIMARY -->
  <g filter="url(#shadow)"><rect x="92" y="228" width="316" height="135" rx="9" fill="#ffffff" stroke="#336791" stroke-width="2.5"/></g>
  <rect x="92" y="228" width="316" height="28" rx="9" fill="#336791"/><rect x="92" y="242" width="316" height="14" fill="#336791"/>
  <text x="108" y="247" font-size="13" font-weight="700" fill="#ffffff">PRIMARY &#183; pg-instance-1</text>
  <rect x="106" y="270" width="135" height="80" rx="6" fill="#eaf1f8" stroke="#5b8db8"/>
  <text x="118" y="292" font-size="12" font-weight="600" fill="#0b1f33">postgres</text>
  <text x="118" y="310" font-size="10.5" fill="#5a6b7b">container</text>
  <text x="118" y="334" font-size="10.5" fill="#5a6b7b">:5432</text>
  <rect x="255" y="270" width="140" height="80" rx="6" fill="#fff3e8" stroke="#b25000"/>
  <text x="266" y="290" font-size="11.5" font-weight="700" fill="#b25000">exporter</text>
  <text x="266" y="307" font-size="10" fill="#7a5230">crunchy-postgres-</text>
  <text x="266" y="319" font-size="10" fill="#7a5230">exporter sidecar</text>
  <text x="266" y="340" font-size="10.5" font-weight="600" fill="#b25000">/metrics :9187</text>

  <!-- REPLICA 1 -->
  <g filter="url(#shadow)"><rect x="92" y="398" width="316" height="135" rx="9" fill="#ffffff" stroke="#5b8db8" stroke-width="2"/></g>
  <rect x="92" y="398" width="316" height="28" rx="9" fill="#5b8db8"/><rect x="92" y="412" width="316" height="14" fill="#5b8db8"/>
  <text x="108" y="417" font-size="13" font-weight="700" fill="#ffffff">REPLICA 1 &#183; pg-instance-2</text>
  <rect x="106" y="440" width="135" height="80" rx="6" fill="#eaf1f8" stroke="#5b8db8"/>
  <text x="118" y="462" font-size="12" font-weight="600" fill="#0b1f33">postgres</text>
  <text x="118" y="480" font-size="10.5" fill="#5a6b7b">standby</text>
  <text x="118" y="504" font-size="10.5" fill="#5a6b7b">:5432</text>
  <rect x="255" y="440" width="140" height="80" rx="6" fill="#fff3e8" stroke="#b25000"/>
  <text x="266" y="460" font-size="11.5" font-weight="700" fill="#b25000">exporter</text>
  <text x="266" y="477" font-size="10" fill="#7a5230">sidecar</text>
  <text x="266" y="510" font-size="10.5" font-weight="600" fill="#b25000">/metrics :9187</text>

  <!-- REPLICA 2 -->
  <g filter="url(#shadow)"><rect x="92" y="568" width="316" height="135" rx="9" fill="#ffffff" stroke="#5b8db8" stroke-width="2"/></g>
  <rect x="92" y="568" width="316" height="28" rx="9" fill="#5b8db8"/><rect x="92" y="582" width="316" height="14" fill="#5b8db8"/>
  <text x="108" y="587" font-size="13" font-weight="700" fill="#ffffff">REPLICA 2 &#183; pg-instance-3</text>
  <rect x="106" y="610" width="135" height="80" rx="6" fill="#eaf1f8" stroke="#5b8db8"/>
  <text x="118" y="632" font-size="12" font-weight="600" fill="#0b1f33">postgres</text>
  <text x="118" y="650" font-size="10.5" fill="#5a6b7b">standby</text>
  <text x="118" y="674" font-size="10.5" fill="#5a6b7b">:5432</text>
  <rect x="255" y="610" width="140" height="80" rx="6" fill="#fff3e8" stroke="#b25000"/>
  <text x="266" y="630" font-size="11.5" font-weight="700" fill="#b25000">exporter</text>
  <text x="266" y="647" font-size="10" fill="#7a5230">sidecar</text>
  <text x="266" y="680" font-size="10.5" font-weight="600" fill="#b25000">/metrics :9187</text>

  <!-- COLLECTOR (ALLOY) -->
  <g filter="url(#shadow)"><rect x="465" y="345" width="210" height="220" rx="10" fill="#e6f6f6" stroke="#0a9396" stroke-width="2.5"/></g>
  <rect x="465" y="345" width="210" height="32" rx="10" fill="#0a9396"/><rect x="465" y="361" width="210" height="16" fill="#0a9396"/>
  <text x="482" y="367" font-size="14" font-weight="700" fill="#ffffff">Grafana Alloy</text>
  <text x="482" y="402" font-size="12.5" font-weight="600" fill="#0b1f33">collector / agent</text>
  <text x="482" y="426" font-size="11.5" fill="#5a6b7b">&#8226; PodMonitor /</text>
  <text x="482" y="442" font-size="11.5" fill="#5a6b7b">  ServiceMonitor discovery</text>
  <text x="482" y="464" font-size="11.5" fill="#5a6b7b">&#8226; scrape :9187</text>
  <text x="482" y="486" font-size="11.5" fill="#5a6b7b">&#8226; relabel + drop</text>
  <text x="482" y="508" font-size="11.5" fill="#5a6b7b">&#8226; batching / WAL buffer</text>
  <text x="482" y="534" font-size="11.5" font-weight="600" fill="#0a9396">&#8594; prometheus.remote_write</text>

  <!-- scrape arrows (horizontal landing, fixed-size heads) -->
  <text x="410" y="298" font-size="11" fill="#0a9396" font-weight="600">scrape</text>
  <path d="M395 312 C 432 312, 446 405, 460 405" fill="none" stroke="#0a9396" stroke-width="2.5" marker-end="url(#scrape)"/>
  <path d="M395 480 C 432 480, 448 460, 460 460" fill="none" stroke="#0a9396" stroke-width="2.5" marker-end="url(#scrape)"/>
  <path d="M395 650 C 434 650, 448 516, 460 516" fill="none" stroke="#0a9396" stroke-width="2.5" marker-end="url(#scrape)"/>

  <!-- ===================== MIMIR ===================== -->
  <rect x="740" y="185" width="395" height="410" rx="16" fill="#ffffff" stroke="#3f3f9e" stroke-width="2.5"/>
  <rect x="740" y="185" width="395" height="44" rx="16" fill="#3f3f9e"/>
  <rect x="740" y="213" width="395" height="16" fill="#3f3f9e"/>
  <text x="764" y="214" font-size="18" font-weight="700" fill="#ffffff">Grafana Mimir</text>
  <text x="940" y="214" font-size="13" fill="#cfcff0">storage + query backend only</text>

  <!-- write path -->
  <g filter="url(#shadow)"><rect x="765" y="250" width="345" height="80" rx="9" fill="#eeeefb" stroke="#3f3f9e" stroke-width="1.5"/></g>
  <text x="782" y="274" font-size="13" font-weight="700" fill="#2d2d7a">Write path</text>
  <text x="782" y="296" font-size="11.5" fill="#4a4a8a">distributor &#8594; ingester</text>
  <text x="782" y="315" font-size="11.5" fill="#4a4a8a">ingests remote_write samples</text>

  <!-- query path -->
  <g filter="url(#shadow)"><rect x="765" y="345" width="345" height="80" rx="9" fill="#eeeefb" stroke="#3f3f9e" stroke-width="1.5"/></g>
  <text x="782" y="369" font-size="13" font-weight="700" fill="#2d2d7a">Query path</text>
  <text x="782" y="391" font-size="11.5" fill="#4a4a8a">query-frontend &#8594; querier</text>
  <text x="782" y="410" font-size="11.5" fill="#4a4a8a">serves PromQL (dashboards + alert eval)</text>

  <!-- object storage -->
  <g filter="url(#shadow)"><rect x="765" y="440" width="345" height="130" rx="9" fill="#eef3ff" stroke="#0f62fe" stroke-width="1.5"/></g>
  <text x="782" y="464" font-size="13" font-weight="700" fill="#0f43a8">Object Storage backend</text>
  <text x="782" y="486" font-size="11.5" fill="#33475b">TSDB blocks &#183; long-term retention</text>
  <text x="782" y="505" font-size="11.5" fill="#33475b">S3 / IBM COS — cheap, durable</text>
  <text x="782" y="534" font-size="11" fill="#5a6b7b">(can reuse the same COS as backups</text>
  <text x="782" y="550" font-size="11" fill="#5a6b7b">&#8594; one durable store for the platform)</text>

  <!-- note: no ruler/alertmanager -->
  <rect x="740" y="610" width="395" height="40" rx="8" fill="#f4f4fb" stroke="#bcbce0" stroke-dasharray="5 3"/>
  <text x="760" y="635" font-size="12" fill="#5a5a9a">Ruler / Alertmanager NOT used &#8212; alerting lives in Grafana.</text>

  <!-- collector -> mimir remote_write -->
  <path d="M675 388 C 702 388, 716 300, 740 288" fill="none" stroke="#3f3f9e" stroke-width="3" marker-end="url(#rw)"/>
  <text x="688" y="430" font-size="12" fill="#3f3f9e" font-weight="700">remote_write</text>

  <!-- ===================== GRAFANA ===================== -->
  <rect x="1175" y="160" width="265" height="285" rx="12" fill="#fff6ee" stroke="#f46800" stroke-width="2.5"/>
  <rect x="1175" y="160" width="265" height="36" rx="12" fill="#f46800"/><rect x="1175" y="178" width="265" height="18" fill="#f46800"/>
  <text x="1196" y="185" font-size="16" font-weight="700" fill="#ffffff">Grafana</text>
  <text x="1196" y="221" font-size="12.5" font-weight="600" fill="#0b1f33">Datasource: Mimir (PromQL)</text>

  <text x="1196" y="246" font-size="12.5" font-weight="700" fill="#b25000">Dashboards (pgMonitor)</text>
  <text x="1208" y="266" font-size="11" fill="#5a6b7b">replication lag &#183; connections</text>
  <text x="1208" y="283" font-size="11" fill="#5a6b7b">cache hit &#183; WAL &#183; bloat &#183; disk</text>

  <line x1="1196" y1="298" x2="1420" y2="298" stroke="#f0c9a8" stroke-width="1.5"/>

  <text x="1196" y="320" font-size="12.5" font-weight="700" fill="#d62828">Unified Alerting</text>
  <text x="1208" y="340" font-size="11" fill="#5a6b7b">rules evaluated vs Mimir</text>
  <text x="1208" y="357" font-size="11" fill="#5a6b7b">pg_up==0, lag &gt; threshold &#8230;</text>
  <text x="1196" y="384" font-size="11.5" font-weight="700" fill="#d62828">Contact point: Webhook</text>
  <text x="1196" y="406" font-size="11" fill="#5a6b7b">notification policies route</text>
  <text x="1196" y="423" font-size="11" fill="#5a6b7b">by env label &#8594; webhook</text>

  <!-- mimir -> grafana query -->
  <text x="1128" y="306" font-size="10.5" fill="#f46800" font-weight="700">PromQL</text>
  <path d="M1135 385 C 1156 385, 1158 322, 1175 322" fill="none" stroke="#f46800" stroke-width="3" marker-end="url(#query)"/>

  <!-- ===================== WEBHOOK-NOTIFIER ===================== -->
  <g filter="url(#shadow)"><rect x="1175" y="485" width="265" height="120" rx="12" fill="#eef7f0" stroke="#2e7d32" stroke-width="2.5"/></g>
  <rect x="1175" y="485" width="265" height="32" rx="12" fill="#2e7d32"/><rect x="1175" y="501" width="265" height="16" fill="#2e7d32"/>
  <text x="1196" y="507" font-size="14" font-weight="700" fill="#ffffff">webhook-notifier (custom)</text>
  <text x="1196" y="540" font-size="11.5" fill="#33475b">&#8226; wraps payload + auth (token/OAuth)</text>
  <text x="1196" y="560" font-size="11.5" fill="#33475b">&#8226; templating &#8594; Teams Adaptive Cards</text>
  <text x="1196" y="580" font-size="11.5" fill="#33475b">&#8226; routes to channel by environment</text>
  <text x="1196" y="598" font-size="10.5" fill="#2e7d32" font-weight="600">our gateway between Grafana and Teams</text>

  <!-- grafana -> notifier (webhook) -->
  <path d="M1307 445 L 1307 483" fill="none" stroke="#d62828" stroke-width="3" marker-end="url(#alert)"/>
  <text x="1322" y="469" font-size="10.5" fill="#d62828" font-weight="700">webhook POST</text>

  <!-- ===================== TEAMS ===================== -->
  <rect x="1175" y="645" width="265" height="200" rx="12" fill="#f0f0fa" stroke="#6264a7" stroke-width="2.5"/>
  <rect x="1175" y="645" width="265" height="36" rx="12" fill="#6264a7"/><rect x="1175" y="663" width="265" height="18" fill="#6264a7"/>
  <text x="1196" y="670" font-size="16" font-weight="700" fill="#ffffff">Microsoft Teams</text>

  <rect x="1192" y="695" width="232" height="54" rx="8" fill="#ffffff" stroke="#6264a7" stroke-width="1.3"/>
  <text x="1204" y="717" font-size="13" font-weight="700" fill="#3b3d78">#Alerting</text>
  <text x="1204" y="737" font-size="11.5" fill="#5a6b7b">prod / preprod alerts</text>

  <rect x="1192" y="757" width="232" height="54" rx="8" fill="#ffffff" stroke="#6264a7" stroke-width="1.3"/>
  <text x="1204" y="779" font-size="13" font-weight="700" fill="#3b3d78">#Alerting-np</text>
  <text x="1204" y="799" font-size="11.5" fill="#5a6b7b">int / dev (non-prod) alerts</text>

  <text x="1196" y="830" font-size="10" fill="#7a8a99">per-channel incoming webhook URLs</text>

  <!-- notifier -> teams -->
  <path d="M1307 605 L 1307 643" fill="none" stroke="#d62828" stroke-width="3" marker-end="url(#alert)"/>
  <text x="1322" y="629" font-size="10.5" fill="#d62828" font-weight="700">post</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="780" width="660" height="120" rx="12" fill="#ffffff" stroke="#d6e0ea"/>
  <text x="62" y="812" font-size="15" font-weight="700" fill="#0b1f33">Flow legend</text>

  <path d="M62 842 L106 842" stroke="#0a9396" stroke-width="2.5" marker-end="url(#scrape)"/>
  <text x="122" y="847" font-size="13" fill="#33475b">Alloy scrapes exporters (:9187)</text>

  <path d="M62 876 L106 876" stroke="#3f3f9e" stroke-width="3" marker-end="url(#rw)"/>
  <text x="122" y="881" font-size="13" fill="#33475b">remote_write into Mimir</text>

  <path d="M400 842 L444 842" stroke="#f46800" stroke-width="3" marker-end="url(#query)"/>
  <text x="460" y="847" font-size="13" fill="#33475b">PromQL: dashboards + alert eval</text>

  <path d="M400 876 L444 876" stroke="#d62828" stroke-width="3" marker-end="url(#alert)"/>
  <text x="460" y="881" font-size="13" fill="#33475b">Grafana &#8594; webhook-notifier &#8594; Teams</text>
</svg>
